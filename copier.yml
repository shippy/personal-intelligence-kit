_min_copier_version: "9.0.0"
_subdirectory: template
_templates_suffix: .jinja
_answers_file: .copier-answers.yml

_skip_if_exists:
  - ".env"
  - ".claude/settings.local.json"
  - "output/**"
  - "logs/**"
  - "data/**"
  - "working/**"

_exclude:
  - "~*"
  - "__pycache__"
  - "*.py[co]"
  - ".venv"
  - ".DS_Store"
  - "config/_paths"
  - "config/_paths.jinja"
  # Conditionally exclude skill directories when their source is disabled
  - "{{ '.claude/skills/email-ingest' if not enable_email else 'NEVER_MATCH' }}"
  - "{{ '.claude/skills/email-analyzer' if not enable_email else 'NEVER_MATCH' }}"
  - "{{ '.claude/skills/browser-ingest' if not enable_browser else 'NEVER_MATCH' }}"
  - "{{ '.claude/skills/session-analyzer' if not enable_browser else 'NEVER_MATCH' }}"
  - "{{ '.claude/skills/journal-ingest' if not enable_journal else 'NEVER_MATCH' }}"
  - "{{ '.claude/skills/tasks-import' if not enable_tasks else 'NEVER_MATCH' }}"
  - "{{ '.claude/skills/git-stats' if not enable_git else 'NEVER_MATCH' }}"
  - "{{ '.claude/skills/draft-coach' if notes_app == 'none' else 'NEVER_MATCH' }}"
  - "{{ '.claude/skills/stale-drafts' if notes_app == 'none' else 'NEVER_MATCH' }}"
  - "{{ 'config' if not enable_scheduled_tasks else 'NEVER_MATCH' }}"
  - "{{ 'config/com.claude.weekly-reflect.plist' if not schedule_reflection else 'NEVER_MATCH' }}"
  - "{{ 'config/com.claude.reflection-reminder.plist' if not reflection_reminder else 'NEVER_MATCH' }}"
  - "{{ 'scripts/reflection-reminder.sh' if not (enable_scheduled_tasks and reflection_reminder) else 'NEVER_MATCH' }}"
  - "{{ '.claude/settings.local.json' if host_web == 'allow' else 'NEVER_MATCH' }}"
  - "{{ 'docs/SETUP-email.md' if not enable_email else 'NEVER_MATCH' }}"
  - "{{ 'docs/SETUP-browser.md' if not enable_browser else 'NEVER_MATCH' }}"
  - "{{ 'docs/SETUP-journal.md' if not enable_journal else 'NEVER_MATCH' }}"
  - "{{ 'docs/SETUP-tasks.md' if not enable_tasks else 'NEVER_MATCH' }}"

# ============================================================
# Identity
# ============================================================

vault_name:
  type: str
  help: "Name for your vault (used in CLAUDE.md header)"
  default: "My Intelligence Vault"

owner_name:
  type: str
  help: "Your name (used throughout CLAUDE.md — e.g., 'Alex', 'Jordan')"
  default: "you"

vault_path:
  type: str
  help: >-
    Absolute path of this generated repo, the logic dir (CLAUDE.md, .claude/, config/,
    scripts/). Sessions start here. Used in launchd plists and scheduled tasks.
  default: "~/Documents/{{ vault_name | lower | replace(' ', '-') }}"

# ============================================================
# Layout (single-dir or split logic/content)
# ============================================================

content_root:
  type: str
  help: >-
    Where content lives (output/, data/, logs/, working/, inbox/). "." keeps everything
    inside the logic dir (single-dir layout, as before v0.8.0). An absolute path puts
    content in a separate directory that is never part of this repo.
  default: "."
  validator: >-
    {% if content_root != '.' and not (content_root.startswith('/') or content_root.startswith('~')) %}
    Use "." or an absolute path (~ is allowed).
    {% endif %}

state_root:
  type: str
  help: >-
    Host-only state (auth records, launchd logs), never mounted into sandboxes.
    Leave empty to keep state in data/ and launchd logs in logs/ (single-dir behaviour).
  default: "{{ '' if content_root == '.' else '~/.local/state/' ~ (vault_name | lower | replace(' ', '-')) }}"

output_root:
  type: str
  help: >-
    Output directory relative to the content root. "output" (default) or "." to put
    reports/, alerts/, reflections/ … directly at the content root.
  default: "output"
  validator: >-
    {% if output_root.startswith('/') or output_root.startswith('~') or '..' in output_root %}
    Must be relative to the content root (e.g. "output" or ".").
    {% elif output_root != '.' and (output_root.startswith('./') or output_root.endswith('/') or '//' in output_root or '/./' in output_root) %}
    Use "." or a plain relative path such as "output" (no "./" prefix or trailing "/").
    {% endif %}

# ============================================================
# Notes / Knowledge Base
# ============================================================

notes_app:
  type: str
  help: "Your notes/PKM app (read-only reference for this vault)"
  choices:
    Obsidian: obsidian
    Logseq: logseq
    Plain markdown files: markdown
    None: none
  default: obsidian

notes_vault_path:
  type: str
  help: "Absolute path to your notes vault (read-only reference)"
  default: "~/Documents/Notes"
  when: "{{ notes_app != 'none' }}"

drafts_path:
  type: str
  help: "Path to drafts folder within your notes vault"
  default: "~/Documents/Notes/Drafts"
  when: "{{ notes_app != 'none' }}"

# ============================================================
# Data Sources
# ============================================================

enable_email:
  type: bool
  help: "Enable email integration? (requires mbsync + notmuch)"
  default: false

email_path:
  type: str
  help: "Path to Maildir email archive"
  default: "~/data/email"
  when: "{{ enable_email }}"

enable_browser:
  type: bool
  help: "Enable browser history / session analysis? (Chromium-based browsers)"
  default: false

browser_type:
  type: str
  help: "Which Chromium-based browser?"
  choices:
    Vivaldi: vivaldi
    Chrome: chrome
    Brave: brave
    Edge: edge
  default: vivaldi
  when: "{{ enable_browser }}"

enable_journal:
  type: bool
  help: "Enable journal/diary integration?"
  default: false

journal_type:
  type: str
  help: "Journal source format"
  choices:
    Rosebud: rosebud
    Day One (JSON export): dayone
    Markdown files: markdown
  default: rosebud
  when: "{{ enable_journal }}"

journal_path:
  type: str
  help: "Path to journal data directory"
  default: "~/data/journal"
  when: "{{ enable_journal }}"

enable_tasks:
  type: bool
  help: "Enable task manager integration?"
  default: false

enable_git:
  type: bool
  help: "Enable git commit stats? (tracks commits across repos, co-authorship with Claude)"
  default: false

task_provider:
  type: str
  help: "Task manager provider"
  choices:
    Microsoft To-Do: microsoft-todo
    Todoist: todoist
    Things 3 (macOS): things
  default: microsoft-todo
  when: "{{ enable_tasks }}"

task_db_path:
  type: str
  help: "Path to task database directory"
  default: "~/data/tasks"
  when: "{{ enable_tasks }}"

# ============================================================
# MCP Integrations
# ============================================================

enable_contacts_mcp:
  type: bool
  help: >-
    Document a contacts MCP (e.g. Clay/Mesh)? It is registered per machine with
    `claude mcp add --scope local`, not in the tracked .mcp.json.
  default: false

# ============================================================
# Security
# ============================================================

host_web:
  type: str
  help: >-
    Agent web tools (WebFetch, WebSearch, Exa, curl/wget) in host sessions of this vault.
    "deny"/"ask" generate a gitignored .claude/settings.local.json; "allow" generates nothing.
  choices:
    Allow (no local settings file): allow
    Ask every time: ask
    Deny (do web research in a sandbox instead): deny
  default: allow

# ============================================================
# Scheduling
# ============================================================

enable_scheduled_tasks:
  type: bool
  help: "Generate launchd plist templates for scheduled sync/reflection runs?"
  default: true

schedule_reflection:
  type: bool
  help: >-
    Run the weekly reflection unattended from launchd? It needs an LLM API key via
    1Password, so it only works with unattended `op` authentication.
  default: false
  when: "{{ enable_scheduled_tasks }}"

reflection_reminder:
  type: bool
  help: "Sunday reminder notification when no weekly reflection was written in the last 6 days?"
  default: "{{ not schedule_reflection }}"
  when: "{{ enable_scheduled_tasks }}"

_message_after_copy: |
  {% if content_root != '.' -%}
  Split layout: content lives outside this repo, in {{ content_root }}.
  Create the content dirs once (skills also create them on demand):

      mkdir -p {{ content_root }}/data {{ content_root }}/logs {{ content_root }}/working {{ content_root }}/inbox/research{% if output_root != '.' %} {{ content_root }}/{{ output_root }}{% endif %}
  {%- if state_root %}
      mkdir -p {{ state_root }}/launchd
  {%- endif %}

  See docs/split-layout.md.
  {% endif -%}
  {% if host_web != 'allow' -%}
  Web policy ({{ host_web }}): .claude/settings.local.json is never overwritten. If it already
  existed, the {{ host_web }} rules were NOT applied; add these to its permissions.{{ host_web }}:
      "WebFetch", "WebSearch", "mcp__plugin_exa_exa__*", "Bash(curl:*)", "Bash(wget:*)"
  and remove any matching "allow" entries.

  {% endif -%}
  {% if enable_contacts_mcp -%}
  Contacts MCP: no longer in .mcp.json. Register it once in local scope (see SETUP.md):
      claude mcp add --scope local ...

  {% endif -%}
  Next: read SETUP.md.
